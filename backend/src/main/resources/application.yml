server:
  port: 8080

spring:
  application:
    name: leaveflow-backend

  datasource:
    # Defaults to in-memory H2 with MySQL compatibility mode for instant run anywhere;
    # Can be overridden by passing MYSQL_URL or activating the mysql profile
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:leaveflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
