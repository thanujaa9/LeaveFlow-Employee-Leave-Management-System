services:
  mysql:
    image: mysql:8.0
    container_name: leaveflow-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: leaveflow_db
      MYSQL_USER: leaveflow_user
      MYSQL_PASSWORD: leaveflow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - leaveflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leaveflow-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: leaveflow_db
      MYSQL_USER: leaveflow_user
      MYSQL_PASSWORD: leaveflow_pass
    ports:
      - "8080:8080"
    networks:
      - leaveflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leaveflow-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - leaveflow-network

networks:
  leaveflow-network:
    driver: bridge

volumes:
  mysql_data:
